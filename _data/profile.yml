short_bio_text_justify: false
short_bio: >-
  I am a Ph.D. student at the <span class="text-pku-red">Institute of Medical Technology, Peking University</span>. My research focuses on <span class="text-highlight">Multimodal Large Language Models for efficient reasoning and comprehension</span>. My interests include <span class="text-highlight">Multimodal Large Language Models</span>, <span class="text-highlight">Weakly Supervised Image Segmentation</span>, and <span class="text-highlight">Medical Image Analysis</span>. I am supervised by <a href="https://nbic.pku.edu.cn/en/Faculty/Researchers/AdjunctPrincipalInvestigators/0a96455fce164e508fbe96162ef92f79.htm" target="_blank">Prof. Yanye Lu</a>.
short_bio_zh: >-
  我是<span class="text-pku-red">北京大学医学技术研究院</span>的博士研究生，研究重点是<span class="text-highlight">多模态大语言模型的高效推理与理解</span>。我的研究兴趣包括<span class="text-highlight">多模态大语言模型</span>、<span class="text-highlight">弱监督图像分割</span>和<span class="text-highlight">医学图像分析</span>，导师为<a href="https://nbic.pku.edu.cn/rcdw/kyry/jzyjy/b33cd89d98fb414681de8b103b36a198.htm" target="_blank">卢闫晔老师</a>。

