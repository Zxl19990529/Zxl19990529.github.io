<nav class="navbar navbar-expand-sm navbar-dark bg-dark fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand" href="{{ '/' | relative_url }}"><strong>{% include i18n.html zh=site.data.profile.primary_name_zh en=site.data.profile.primary_name %}</strong></a>
        <div class="ml-auto ml-sm-3 order-sm-3">
            {% include language_switcher.html %}
        </div>
        <button class="navbar-toggler ml-2" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="展开导航" data-i18n-aria-label-zh="展开导航" data-i18n-aria-label-en="Toggle navigation">
            <i class="fas fa-bars" aria-hidden="true"></i>
        </button>

        <div class="collapse navbar-collapse order-sm-2" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title %}active{% endif %}">
                    <a class="nav-link" href="{{ item.url | relative_url }}" {% if item.name == page.navbar_title %}aria-current="page"{% endif %}>{% include i18n.html zh=item.name_zh en=item.name %}</a>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</nav>
