<div class="language-switcher" role="group" aria-label="选择语言" data-i18n-aria-label-zh="选择语言" data-i18n-aria-label-en="Choose language">
    <button class="language-button active" type="button" data-set-language="zh" aria-pressed="true" aria-label="切换到中文" lang="zh-CN">CN</button>
    <span class="language-divider" aria-hidden="true">/</span>
    <button class="language-button" type="button" data-set-language="en" aria-pressed="false" aria-label="Switch to English" lang="en">EN</button>
</div>
